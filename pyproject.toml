[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boxing-analytics-assistant"
version = "0.1.0"
description = "Assistive boxing judging and analytics decision support"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "VarBox Team" }]
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
runtime = [
  "numpy==2.4.3",
  "lap==0.5.13",
  "opencv-python==4.13.0.92",
  "mediapipe==0.10.32",
  "PySide6-Essentials==6.10.2",
  "scipy==1.17.1",
  "fpdf2==2.8.7",
  "protobuf==7.34.0",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "torchaudio==2.10.0",
  "gdown==5.2.1",
  "torchreid==0.2.5",
  "ultralytics==8.4.22",
  "certifi==2026.6.17",
]
dev = [
  "black==24.10.0",
  "ruff==0.6.9",
  "mypy==1.11.2",
  "pytest==8.3.3",
  "pre-commit==3.8.0",
  "types-PyYAML==6.0.12.20240917",
]
videomae = [
  "transformers>=4.57.0,<5",
  "accelerate>=1.10,<2",
  "safetensors>=0.6,<1",
]
sam2 = [
  "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
  "hydra-core>=1.3,<2",
  "iopath>=0.1.10,<1",
  "pillow>=10,<13",
]
ml = [
  "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
  "transformers>=4.57.0,<5",
  "accelerate>=1.10,<2",
  "safetensors>=0.6,<1",
  "hydra-core>=1.3,<2",
  "iopath>=0.1.10,<1",
  "pillow>=10,<13",
]

[project.scripts]
boxing-analytics = "boxing_analytics.app.cli:main"
boxing-analytics-calibrate = "boxing_analytics.calibration.calibrate_camera:main"
boxing-analytics-eval = "boxing_analytics.eval.run:main"
boxing-analytics-dataset-audit = "boxing_analytics.training.dataset_audit:main"
boxing-analytics-train-videomae = "boxing_analytics.training.train_videomae:main"
boxing-analytics-eval-videomae = "boxing_analytics.training.evaluate_videomae:main"
boxing-analytics-4d = "boxing_analytics.mesh4d.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = "^/(src|tests)/.*\\.py$"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
mypy_path = "src"
files = ["src"]
exclude = [
  "^output/",
  "^assets/",
]

# Legacy prototype modules at the repository root are untyped; the typed package only calls them.
[[tool.mypy.overrides]]
module = [
  "multi_person_tracker",
  "mediapipe_compat",
  "color_signature",
  "boxer_registry",
  "participant_manager",
  "identity_bootstrap",
  "punch_detector",
  "video_processor",
  "config",
  "runtime_profile",
  "opencv_guard",
]
follow_imports = "skip"

# Heavy ML libraries without usable type information. CI installs only some of them, so they are
# treated as untyped everywhere to keep local and CI results identical.
[[tool.mypy.overrides]]
module = [
  "transformers", "transformers.*",
  "sam2", "sam2.*",
  "ultralytics", "ultralytics.*",
  "torchvision", "torchvision.*",
  "mediapipe", "mediapipe.*",
  "huggingface_hub", "huggingface_hub.*",
  "torchreid", "torchreid.*",
]
follow_imports = "skip"
ignore_missing_imports = true

# numpy's stubs type most array arithmetic as Any; flagging every such return adds only noise.
[[tool.mypy.overrides]]
module = ["boxing_analytics.mesh4d.*"]
warn_return_any = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: higher-level behavior across modules",
]
