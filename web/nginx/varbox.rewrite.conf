# VAR Box routing (installed by the GitHub deploy workflow into the aaPanel rewrite include).
# Media and job previews go through PHP for the login check, then nginx serves the file from the
# internal /storage/ location, which supports seeking in video.
location ^~ /storage/ { internal; }
location ^~ /src/ { return 404; }
location ^~ /media/ { rewrite ^ /index.php last; }
location ^~ /preview/ { rewrite ^ /index.php last; }
location / { try_files $uri $uri/ /index.php?$query_string; }
